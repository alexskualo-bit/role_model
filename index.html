се активные статусы.","source":"Реестр групп","period":"Месяц","target":0.98,"action":"Дополнить карточки подтверждения."},{"name":"Результативность","metric":"Продление участников форумов","formula":"Оплатившие продление участники форума ÷ все участники форума, у которых в периоде наступила дата продления. Членство в группе определяется до этой даты.","source":"Членство / платежи / реестр групп","period":"Год","target":100,"action":"Сопоставить продление с участниками вне форумов того же стажа."},{"name":"Операционная устойчивость","metric":"Изменения без повторного ввода","formula":"Подтверждённые входы и выходы, изменившие статус автоматически ÷ все подтверждённые изменения состава.","source":"Интеграция групп / профиль","period":"Месяц","target":0.9,"action":"Настроить передачу изменений из реестра групп."}],"effects":[{"recipient":"Участник","name":"Доступ к работающей малой группе","formula":"Проведённые встречи форум-групп ÷ все запланированные встречи действующих групп за период. Посещение встречи не является условием роли.","source":"Календарь форум-групп","period":"Квартал","target":1},{"recipient":"Бенефициар","name":"Разница в продлении с участниками вне форумов","formula":"Продление форум-участников минус продление сопоставимых участников вне форумов, в процентных пунктах. Сравнение не доказывает причинное влияние.","source":"Членство / платежи / реестр групп","period":"Год","target":100}],"economyInputs":["Уникальные участники форумов за год","Участники форумов с датой продления","Оплатившие продление участники форумов","Часы команды на работу форум-групп","Полная стоимость часа команды","Прямые расходы форум-групп","Относимые расходы платформы","Утверждённый бюджет форумов","Маржинальный доход одного продления"]},{"name":"Участник комитета","short":"Член комитета участвует в работе коллегиального органа клуба. Индекс показывает, действует ли комитет; эффекты — ощущение влияния участника и пользу для работы клуба.","dimensions":[{"name":"Жизнеспособность","metric":"Укомплектованность комитета","formula":"Действующие назначенные члены комитета ÷ утверждённое число мест. Учитывать только назначения, действующие на дату проверки.","source":"Реестр назначений","period":"Квартал","target":0.8,"action":"Если мест занято мало, согласовать кандидатов и сроки назначения."},{"name":"Актуальность","metric":"Потребность клуба в комитете","formula":"Раз в полгода владелец роли подтверждает, нужен ли комитет клубу для работы по своему направлению: «Да» = 100%, «Нет» = 0%. Ответ старше 183 дней — недостаточно данных.","source":"Подтверждение владельца роли","period":"Полугодие","target":1,"action":"Получить актуальное подтверждение потребности; при ответе «Нет» пересмотреть мандат комитета."},{"name":"Управляемость","metric":"Выполненные условия управления","formula":"Ввести число выполненных условий (0–5): 1) назначен владелец роли с контактом; 2) утверждены состав и сроки полномочий; 3) назначен ответственный за созыв заседаний; 4) есть календарь на текущий период; 5) определено, кто и где фиксирует итоги.","source":"Настройки роли / календарь","period":"Квартал","target":5,"action":"Создать задачу по каждому отсутствующему условию."},{"name":"Подтверждаемость","metric":"Заседания с записью итога","formula":"Заседания с датой, составом присутствовавших и кратким итогом ÷ все состоявшиеся заседания. Отменённые встречи не учитывать.","source":"Календарь / карточки заседаний","period":"Квартал","target":0.95,"action":"Дозаполнить карточки заседаний."},{"name":"Результативность","metric":"Посещаемость членов комитета","formula":"Сумма присутствий действующих членов на состоявшихся заседаниях ÷ сумма возможных присутствий этих членов. Гостей и отменённые встречи исключить. Если встреч не было — недостаточно данных.","source":"Посещаемость заседаний","period":"Квартал","target":0.75,"action":"Обсудить с пропускающими членами готовность продолжать работу."},{"name":"Операционная устойчивость","metric":"Учёт без повторного ввода","formula":"Состоявшиеся заседания, для которых календарь, состав и краткий итог заполнены в одной карточке, ÷ все состоявшиеся заседания.","source":"Карточки заседаний","period":"Квартал","target":0.8,"action":"Упростить шаблон карточки и убрать повторный ручной ввод."}],"effects":[{"recipient":"Участник","name":"Ощущение реального влияния","formula":"Раз в год спросить членов комитета: «Могли ли вы через комитет повлиять на развитие клуба?» Да = 100, частично = 50, нет = 0. Средний балл ответивших; если ответов нет — недостаточно данных.","source":"Один вопрос членам комитета","period":"Год","target":0.75},{"recipient":"Бенефициар","name":"Польза комитета для работы клуба","formula":"Раз в полгода владелец направления отвечает: «Помог ли комитет разобраться с вопросами своего направления?» Да = 100, частично = 50, нет = 0. Ответ старше 183 дней — недостаточно данных.","source":"Один ответ владельца направления","period":"Полугодие","target":0.75}],"economyInputs":["Проведённые заседания","Рассмотренные вопросы","Подготовленные рекомендации","Часы команды на работу комитета","Полная стоимость часа команды","Прямые расходы заседаний и коммуникаций","Доля стоимости системы","Действующие члены комитета","Утверждённый бюджет работы комитета"]},{"name":"Проводник","short":"Проводник сопровождает новичка минимум три месяца, обычно одновременно 1–2 человек. Экономический эффект продления первого года показываем как сценарий по сопоставимым когортам, а не как доказанную причинную выгоду.","dimensions":[{"name":"Жизнеспособность","metric":"Активные проводники","formula":"Проводники с хотя бы одним закреплённым новичком за 12 месяцев ÷ действующие проводники. Без закреплений год — повод пересмотреть роль.","source":"Реестр назначений","period":"Год","target":0.8,"action":"Проверить доступность и подтверждение готовности."},{"name":"Актуальность","metric":"Своевременные назначения","formula":"Согласившиеся на сопровождение новички, получившие проводника в согласованный срок ÷ все согласившиеся новички с наступившим сроком.","source":"CRM / назначения","period":"Месяц","target":0.9,"action":"Проверить подбор пары и согласие участников."},{"name":"Управляемость","metric":"Выполненные условия управления","formula":"0–5: владелец и распределение; проверка критериев; согласие пары; срок от трёх месяцев и нагрузка до двух новичков; итог и пересмотр роли.","source":"Карточки пар","period":"Квартал","target":5,"action":"Назначить владельца недостающего условия."},{"name":"Подтверждаемость","metric":"Карточки с итоговым статусом","formula":"Пары с ID проводника и новичка, согласием, датами начала и окончания 90 дней и итоговым статусом («завершено» или «прекращено») ÷ все пары, у которых наступил 90-й день. Отсутствующий статус не считается заполненной карточкой.","source":"CRM / карточки пар","period":"Квартал","target":0.95,"action":"Заполнить недостающие даты или итоговый статус пары."},{"name":"Результативность","metric":"Завершённое сопровождение","formula":"Пары, дошедшие до конца трёхмесячного срока без досрочного прекращения и закрытые со статусом «завершено», ÷ все подтверждённые пары, у которых в квартале наступил 90-й день. Пара без итогового статуса не входит в числитель.","source":"Реестр / карточки пар","period":"Квартал","target":0.9,"action":"Проверить досрочно прекращённые пары и пары без итогового статуса."},{"name":"Операционная устойчивость","metric":"Пары без перегрузки","formula":"Активные пары, где у проводника ≤2 новичков и был контакт за 30 дней ÷ все активные пары.","source":"Реестр / контакты","period":"Месяц","target":0.9,"action":"Перераспределить пары и напомнить о контакте."}],"effects":[{"recipient":"Участник","name":"Полезность Проводника для новичка","formula":"При завершении пары или достижении 90 дней задать один вопрос: «Помог ли Проводник вам освоиться в клубе?» Да = 100, частично = 50, нет = 0. Средний балл ответивших; без ответов — недостаточно данных.","source":"Один вопрос новичку","period":"Квартал","target":0.85},{"recipient":"Бенефициар","name":"Разница первых продлений","formula":"Доля первого продления у новичков с проводником минус доля в сопоставимой когорте без него. Сравнить период вступления и сегмент; это ассоциация, не причинность.","source":"Членство / пары","period":"Год","target":0.05},{"recipient":"Бенефициар","name":"Завершённая трёхмесячная адаптация","formula":"Те же пары, что в результативности роли: завершённое трёхмесячное сопровождение ÷ все пары, у которых наступил 90-й день. Числа берутся из единой строки ввода индекса, повторно вводить их не нужно.","source":"Карточки пар","period":"Квартал","target":0.9}],"economyInputs":["Продлившие первый год с проводником","Все с проводником с датой первого продления","Продлившие первый год без проводника","Все без проводника с датой продления","Маржа одного первого продления","Часы команды на программу","Полная стоимость часа команды","Прямые расходы программы","Доля системы","Сопровождаемые новички"]},{"name":"Основатель отраслевого клуба","short":"Главный результат: согласованный с ClubFirst отраслевого клуб проходит пилот и передаётся в регулярную работу. Статус основателя сохраняется при смене действующего лидера.","dimensions":[{"name":"Жизнеспособность","metric":"Основанные отраслевые клубы с регулярной работой","formula":"Основанные отраслевые клубы, где после пилота есть действующий лидер и календарь встреч, ÷ все клубы этого типа с активным статусом. Передача лидерства не отменяет статус основателя.","source":"Реестр клубов и календарь","period":"Полугодие","target":0.85,"action":"Назначить текущего лидера и согласовать календарь; не пересматривать статус основателя только из-за передачи лидерства."},{"name":"Актуальность","metric":"Покрытие приоритетных отраслей","formula":"Приоритетные отрасли с действующим отраслевым клубом или согласованным пилотом ÷ все отрасли в заранее утверждённом списке с наибольшим числом действующих участников ClubFirst. Список составляется по основной отрасли компании в профиле на начало полугодия. Каждую отрасль учитываем один раз.","source":"Профиль участников / ПСВ + реестр отраслевых клубов","period":"Полугодие","target":1,"action":"Сначала проработать отрасли с наибольшим числом участников, где ещё нет клуба или пилота."},{"name":"Управляемость","metric":"5 условий основания отраслевого клуба","formula":"Введите 0–5 полностью выполненных условий: 1) назначен владелец процесса; 2) команда согласовала отраслевой профиль и формат встреч в рамках членства; 3) подтверждены не менее 4 встреч, 15 релевантных участников и ядро из 5; 4) раздельно зафиксированы основатель и действующий лидер; 5) пройдена проверка Кодекса, жалоб и конфликта интересов. Балл = выполнено ÷ 5 × 100.","source":"Карточка основания клуба","period":"При присвоении","target":5,"action":"Закрыть недостающие условия до признания статуса."},{"name":"Подтверждаемость","metric":"Полные досье отраслевого клуба","formula":"Досье с ID клуба и основателя, решением команды, датами 4 встреч, 15 уникальными релевантными участниками, ядром из 5 и решением о статусе ÷ все присвоенные статусы основателя отраслевого клуба.","source":"Карточка клуба и события","period":"Квартал","target":0.95,"action":"Связать доказательства запуска с карточкой основателя."},{"name":"Результативность","metric":"Устойчивый запуск отраслевого клуба","formula":"Клубы с регулярными встречами и активным ядром не менее 5 человек через 6 месяцев после присвоения статуса ÷ клубы этого типа, для которых прошло 6 месяцев. Это оценка запуска, а не условие сохранения статуса основателя.","source":"Календарь и реестр участников","period":"Полугодие","target":0.75,"action":"Разобрать причины снижения активности и поддержать действующего лидера."},{"name":"Операционная устойчивость","metric":"Передача клуба в регулярное управление","formula":"Основанные отраслевые клубы с назначенным действующим лидером, календарём и владельцем операционных задач ÷ все клубы этого типа, завершившие пилот.","source":"Карточка год","explanation":"(Часы владельца + оператора) × 12 × стоимость часа"},{"name":"Прямые расходы + бесплатный месяц","formula":"=IF(OR(B31=\\"\\",B24=\\"\\",B33=\\"\\"),\\"\\",B31+B24*B33)","unit":"руб./год","explanation":"Бюджет роли + новые участники × стоимость 1 бесплатного месяца"},{"name":"Стоимость системы","formula":"=IF(B32=\\"\\",\\"\\",B32)","unit":"руб./год","explanation":"Доля платформы и интеграций"},{"name":"Общие затраты","formula":"=IF(COUNT(F28:F30)<3,\\"\\",SUM(F28:F30))","unit":"руб./год","explanation":"Время команды + прямые расходы + система"},{"name":"Чистый эффект","formula":"=IF(OR(F27=\\"\\",F31=\\"\\"),\\"\\",F27-F31)","unit":"руб./год","explanation":"Валовая выгода − общие затраты"}],"requiredData":"ID лидера; ID рекомендации и кандидата; дата; этапы отбора; решение; дата и сумма оплаты; план канала; дата продления лидера; стоимость одного бесплатного месяца.","methodNote":"Пустой факт означает «Недостаточно данных». Проценты вводятся как 70%, а не 70. Жёлтые ячейки — ввод пользователя; остальные показатели и экономика пересчитываются автоматически.","additionalRows":[]},{"name":"Основатель тематического клуба","description":"Главный результат: согласованный с ClubFirst тематического клуб проходит пилот и передаётся в регулярную работу. Статус основателя сохраняется при смене действующего лидера.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Основанные тематические клубы с регулярной работой","calculation":"Основанные тематические клубы, где после пилота есть действующий лидер и календарь встреч, ÷ все клубы этого типа с активным статусом. Передача лидерства не отменяет статус основателя.","source":"Реестр клубов и календарь","period":"Полугодие","unit":"%","example":null,"target":0.85,"scoreFormula":"=IF(H10=\\"\\",\\"\\",MIN(H10/I10,1)*100)","weightedFormula":"=IF(J10=\\"\\",\\"\\",J10*B10)","action":"Назначить текущего лидера и согласовать календарь; не пересматривать статус основателя только из-за передачи лидерства."},{"name":"Актуальность","weight":0.15,"metric":"Покрытие приоритетных тем","calculation":"Приоритетные темы с действующим тематическим клубом или согласованным пилотом ÷ все темы в заранее утверждённом списке с наибольшим числом заинтересованных действующих участников. Интерес берётся из выбранных участником тегов или явных запросов до запуска, а не из посещаемости уже существующих клубов. Каждую тему учитываем один раз.","source":"Теги и запросы участников / ПСВ + реестр тематических клубов","period":"Полугодие","unit":"%","example":"=IF(COUNT(B44)<1,\\"\\",B44)","target":1,"scoreFormula":"=IF(OR(COUNT(H11:I11)<2,I11=0),\\"\\",MIN(H11/I11,1)*100)","weightedFormula":"=IF(COUNT(J11)<1,\\"\\",J11*B11)","action":"Проверить темы с наибольшим подтверждённым интересом, по которым ещё нет клуба или пилота."},{"name":"Управляемость","weight":0.2,"metric":"5 условий основания тематического клуба","calculation":"Введите 0–5 полностью выполненных условий: 1) назначен владелец процесса; 2) команда согласовала тему, аудиторию и платную модель встреч; 3) подтверждены не менее 4 встреч, 15 релевантных участников и ядро из 5; 4) раздельно зафиксированы основатель и действующий лидер; 5) пройдена проверка Кодекса, жалоб и конфликта интересов. Балл = выполнено ÷ 5 × 100.","source":"Карточка основания клуба","period":"При присвоении","unit":"Количество 0–5","example":null,"target":5,"scoreFormula":"=IF(H12=\\"\\",\\"\\",MIN(H12/I12,1)*100)","weightedFormula":"=IF(J12=\\"\\",\\"\\",J12*B12)","action":"Закрыть недостающие условия до признания статуса."},{"name":"Подтверждаемость","weight":0.15,"metric":"Полные досье тематического клуба","calculation":"Досье с ID клуба и основателя, решением команды, датами 4 встреч, 15 уникальными релевантными участниками, ядром из 5 и решением о статусе ÷ все присвоенные статусы основателя тематического клуба.","source":"Карточка клуба и события","period":"Квартал","unit":"%","example":null,"target":0.95,"scoreFormula":"=IF(H13=\\"\\",\\"\\",MIN(H13/I13,1)*100)","weightedFormula":"=IF(J13=\\"\\",\\"\\",J13*B13)","action":"Связать доказательства запуска с карточкой основателя."},{"name":"Результативность","weight":0.25,"metric":"Устойчивый запуск тематического клуба","calculation":"Клубы с регулярными встречами и активным ядром не менее 5 человек через 6 месяцев после присвоения статуса ÷ клубы этого типа, для которых прошло 6 месяцев. Это оценка запуска, а не условие сохранения статуса основателя.","source":"Календарь и реестр участников","period":"Полугодие","unit":"%","example":null,"target":0.75,"scoreFormula":"=IF(H14=\\"\\",\\"\\",MIN(H14/I14,1)*100)","weightedFormula":"=IF(J14=\\"\\",\\"\\",J14*B14)","action":"Разобрать причины снижения активности и поддержать действующего лидера."},{"name":"Операционная устойчивость","weight":0.1,"metric":"Передача клуба в регулярное управление","calculation":"Основанные тематические клубы с назначенным действующим лидером, календарём и владельцем операционных задач ÷ все клубы этого типа, завершившие пилот.","source":"Карточка клуба и канбан","period":"Полугодие","unit":"%","example":null,"target":0.9,"scoreFormula":"=IF(H15=\\"\\",\\"\\",MIN(H15/I15,1)*100)","weightedFormula":"=IF(J15=\\"\\",\\"\\",J15*B15)","action":"Закрыть передачу задач и обновить распределение полномочий."}],"effects":[{"recipient":"Участник","name":"Публичная видимость основателя","calculation":"Отметьте 1, если имя основателя тематического клуба указано в анонсе запуска, на странице клуба и в профиле; иначе 0. Факт = сумма трёх отметок ÷ 3. Проверка по опубликованным материалам за первый год.","source":"Анонс запуска, страница клуба, профиль участника","period":"Первый год","unit":"Три отметки 0/1","example":"=IF(COUNT(J19:L19)<3,\\"\\",(J19+K19+L19)/3)","target":1,"scoreFormula":"=IF(ISNUMBER(G19),G19*100,\\"\\")"},{"recipient":"Бенефициар","name":"Возвращение участников к клубным активностям","calculation":"Уникальные посетители тематического клуба без других клубных активностей за 90 дней до первого посещения ÷ все уникальные посетители клуба за первый год. Один человек — один раз.","source":"Посещаемость, профиль и история активностей","period":"Первый год","unit":"%","example":null,"target":null,"scoreFormula":"=IF(G20=\\"\\",\\"\\",IF(H20=\\"\\",\\"\\",IF(H20=0,\\"\\",MIN(G20/H20,1)*100)))"}],"economyTitle":"Экономика первого года основанного клуба","economyInputs":[{"name":"Оплата за тематические встречи после возвратов","example":null,"unit":"руб./год","source":"Финансы / платежи за первый год"},{"name":"Целевое внешнее финансирование","example":null,"unit":"руб./год","source":"Финансы / поступившие деньги"},{"name":"Прямые расходы запуска","example":null,"unit":"руб./год","source":"Финансы / акты запуска"},{"name":"Прямые расходы встреч первого года","example":null,"unit":"руб./год","source":"Финансы / акты встреч"},{"name":"Часы команды на запуск и ведение за год","example":null,"unit":"час.","source":"Канбан / учёт времени"},{"name":"Полная стоимость часа команды","example":null,"unit":"руб./час","source":"Финансы / кадровые данные"},{"name":"Дополнительные расходы на систему","example":null,"unit":"руб./год","source":"Финансы / ИТ; 0, если не было"},{"name":"Годовой бюджет: запуск и работа клуба","example":null,"unit":"руб./год","source":"Утверждённый бюджет первого года"},{"name":"Уникальные посетители за первый год","example":null,"unit":"чел.","source":"Посещаемость; каждый человек один раз"}],"economyOutputs":[{"name":"Подтверждённые поступления","formula":"=IF(COUNT(B24:B25)<2,\\"\\",SUM(B24:B25))","unit":"руб./год","explanation":"B24 + B25"},{"name":"Прямые расходы: запуск и встречи","formula":"=IF(COUNT(B26:B27)<2,\\"\\",SUM(B26:B27))","unit":"руб./год","explanation":"B26 + B27"},{"name":"Стоимость времени команды","formula":"=IF(COUNT(B28:B29)<2,\\"\\",B28*B29)","unit":"руб./год","explanation":"B28 × B29"},{"name":"Дополнительные расходы на систему","formula":"=IF(COUNT(B30)<1,\\"\\",B30)","unit":"руб./год","explanation":"B30"},{"name":"Общие затраты за год","formula":"=IF(COUNT(F25:F27)<3,\\"\\",SUM(F25:F27))","unit":"руб./год","explanation":"F25 + F26 + F27"},{"name":"Чистый финансовый результат","formula":"=IF(COUNT(F24,F28)<2,\\"\\",F24-F28)","unit":"руб./год","explanation":"F24 − F28"},{"name":"Стоимость охвата одного посетителя","formula":"=IF(OR(F28=\\"\\",B32=\\"\\",B32=0),\\"\\",F28/B32)","unit":"руб./чел.","explanation":"F28 ÷ B32"},{"name":"Доходность затрат","formula":"=IF(OR(F29=\\"\\",F28=\\"\\",F28=0),\\"\\",F29/F28)","unit":"%","explanation":"F29 ÷ F28"},{"name":"Отклонение от годового бюджета","formula":"=IF(OR(B31=\\"\\",F28=\\"\\"),\\"\\",B31-F28)","unit":"руб./год","explanation":"B31 − F28"}],"requiredData":"Первый год тематического клуба: в B24 и B25 внесите только фактически полученные деньги (0, если поступлений не было). B26:B27 — разные прямые расходы без дублей; B28:B29 — фактические часы и стоимость часа; B30 — дополнительные расходы на систему или 0; B31 — полный годовой бюджет; B32 — уникальные посетители.","methodNote":"Чистый результат = полученные деньги − общие затраты. Доходность = чистый результат ÷ общие затраты; отрицательное значение допустимо. Отклонение бюджета не является экономией, если программа не выполнена. Членские взносы и предполагаемые продления в поступления не включаются.","additionalRows":[["Актуальность: покрытие приоритетных тем",null,null,null,null,null,null,null],["Параметр","Ввод / расчёт","Источник","Правило",null,null,null,null],["Число тем в утверждённом приоритетном списке",null,"Теги и запросы участников / ПСВ + реестр тематических клубов","Список с максимальной численностью / интересом утверждается до начала полугодия; только подтверждённые данные.",null,null,null,null],["Из них: есть действующий клуб или согласованный пилот",null,"Реестр клубов / решение команды","Считайте тема один раз, даже если есть несколько инициатив. Идея без согласованного пилота не покрывает направление.",null,null,null,null],["Покрытие приоритетного списка","=IF(OR(COUNT(B42:B43)<2,B42=0,B43>B42,B43<0),\\"\\",B43/B42)","Расчёт","Покрытые направления ÷ все приоритетные направления. Цель: 100% списка.",null,null,null,null],["Проверка чисел","=IF(COUNT(B42:B43)<2,\\"\\",IF(B43>B42,\\"Ошибка: покрытых больше, чем в списке\\",IF(B42=0,\\"Нет списка\\",\\"\\")))",null,null,null,null,null,null],["На начало полугодия посчитайте уникальных действующих участников, выбравших каждую тему в профиле или явно заявивших интерес. Один участник может входить в несколько тем, но внутри одной темы учитывается один раз. При неполных тегах не подменяйте спрос посещаемостью.",null,null,null,null,null,null,null]]},{"name":"Лидер отраслевого клуба","description":"Главный результат: Отраслевой клуб формирует устойчивое профессиональное ядро, деловые связи и отраслевую повестку.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Выполнение календаря отраслевого клуба","calculation":"Проведённые отраслевые встречи ÷ утверждённый план встреч клуба. В расчёт входят только состоявшиеся встречи с зафиксированной программой и участниками.","source":"Календарь активностей","period":"Квартал","unit":"%","example":0.85,"target":0.9,"scoreFormula":"=IF(H10=\\"\\",\\"\\",MIN(H10/I10,1)*100)","weightedFormula":"=IF(J10=\\"\\",\\"\\",J10*B10)","action":"Разобрать отмены и скорректировать календарь или ресурсную поддержку."},{"name":"Актуальность","weight":0.15,"metric":"Представленность целевой отрасли","calculation":"Уникальные участники встреч, соответствующие отраслевому профилю клуба ÷ все уникальные участники встреч. Профиль определяется заранее по отрасли компании или профессиональной функции.","source":"ПСВ / профиль / посещаемость","period":"Квартал","unit":"%","example":0.72,"target":0.75,"scoreFormula":"=IF(H11=\\"\\",\\"\\",MIN(H11/I11,1)*100)","weightedFormula":"=IF(J11=\\"\\",\\"\\",J11*B11)","action":"Уточнить отраслевой профиль, темы и приглашение недостающих сегментов."},{"name":"Управляемость","weight":0.2,"metric":"5 условий 15=\\"\\",\\"\\",MIN(H15/I15,1)*100)","weightedFormula":"=IF(J15=\\"\\",\\"\\",J15*B15)","action":"Связать календарь, профиль компании, регистрацию, опросы и членство по ID."}],"effects":[{"recipient":"Участник","name":"Полезные отраслевые связи и решения","calculation":"Участники, подтвердившие получение релевантного контакта, практического ответа или отраслевого решения ÷ ответившие участники встреч.","source":"Опрос после встречи","period":"Квартал","unit":"%","example":0.68,"target":0.75,"scoreFormula":"=IF(G19=\\"\\",\\"\\",MAX(0,MIN(G19/H19,1)*100))"},{"recipient":"Бенефициар","name":"Продление ядра отраслевого клуба","calculation":"Продлившие членство участники отраслевого ядра ÷ участники ядра с наступившей датой продления.","source":"ПСВ / членство","period":"Год","unit":"%","example":0.82,"target":0.85,"scoreFormula":"=IF(G20=\\"\\",\\"\\",MAX(0,MIN(G20/H20,1)*100))"}],"economyTitle":"Первичный расчёт экономики владельца роли","economyInputs":[{"name":"Бюджет запланированных отраслевых встреч","example":null,"unit":"руб./год","source":"Утверждённый бюджет"},{"name":"Фактические прямые расходы отраслевых встреч","example":null,"unit":"руб./год","source":"Финансы / акты"},{"name":"Запланированные отраслевые встречи","example":null,"unit":"встреч","source":"Утверждённый календарь"},{"name":"Проведённые отраслевые встречи","example":null,"unit":"встреч","source":"Календарь / карточки встреч"},{"name":"Участники отраслевого ядра с 2+ посещениями","example":null,"unit":"чел.","source":"Посещаемость / профиль"}],"economyOutputs":[{"name":"Утверждённый бюджет","formula":"=B24","unit":"руб./год","explanation":"Плановый лимит по отраслевым встречам"},{"name":"Фактические прямые расходы","formula":"=B25","unit":"руб./год","explanation":"Расходы на те же встречи за тот же год"},{"name":"Стоимость проведённой встречи","formula":"=IF(B27=0,\\"\\",B25/B27)","unit":"руб./встреча","explanation":"Фактические расходы ÷ проведённые встречи"},{"name":"Стоимость участника регул formula":null,"unit":null,"explanation":null}],"requiredData":"Для экономики загрузите по ID тематического клуба: фактически полученную оплату за тематические встречи за вычетом возвратов; фактически полученные целевые внешние поступления; утверждённый бюджет именно проведённых встреч; фактические прямые расходы на те же встречи; прочие прямые расходы; часы команды и долю системы. Самофинансирование = поступления ÷ все прямые расходы. Экономия бюджета = бюджет проведённых встреч − фактические расходы на них; это справочный показатель и второй раз в доход не прибавляется. Продления ядра показывайте как отдельный эффект, без приписывания клубу всей выручки от членства.","methodNote":"Для экономики заполните все жёлтые поля B24:B32. До этого ноль в финансовых итогах не означает рассчитанный результат.","additionalRows":[]},{"name":"Лидер трека","description":"Главный результат: Трек превращает устойчивый интерес к теме или бизнес-задаче в регулярную прикладную работу участников.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Выполнение пилотного и регулярного календаря","calculation":"Проведённые встречи трека ÷ утверждённый план. На пилоте план должен включать не менее 2 встреч; далее — согласованную регулярность раз в квартал или раз в два месяца.","source":"Календарь активностей","period":"Квартал","unit":"%","example":0.88,"target":0.9,"scoreFormula":"=IF(H10=\\"\\",\\"\\",MIN(H10/I10,1)*100)","weightedFormula":"=IF(J10=\\"\\",\\"\\",J10*B10)","action":"Разобрать отмены и скорректировать частоту, формат или ресурсную поддержку."},{"name":"Актуальность","weight":0.15,"metric":"Подтверждённый интерес к теме","calculation":"Полученные положительные отклики ÷ порог 20 откликов. Если вместо опроса проведён «Нерандомный кофе», факт рассчитывается как участники, подтвердившие интерес после встречи ÷ целевой порог участников этого теста.","source":"Опрос в ленте / Нерандомный кофе","period":"Пилот","unit":"%","example":0.8,"target":1,"scoreFormula":"=IF( ","weight":0.1,"metric":"Автоматический контроль трека","calculation":"Встречи, где регистрации, посещаемость, обратная связь и состав ядра связаны автоматически ÷ все встречи трека.","source":"Интеграции","period":"Месяц","unit":"%","example":0.5,"target":0.85,"scoreFormula":"=IF(H15=\\"\\",\\"\\",MIN(H15/I15,1)*100)","weightedFormula":"=IF(J15=\\"\\",\\"\\",J15*B15)","action":"Связать календарь, регистрацию, опросы и профили участников по ID."}],"effects":[{"recipient":"Участник","name":"Охват экспертной повестки лидера","calculation":"Уникальные участники встреч трека, где носитель роли указан лидером. Повторные посещения одного человека не дублируются. Это видимый охват его повестки, а не оценка будущих сделок.","source":"Карточка события и посещаемость по ID человека","period":"Год","unit":"чел.","example":null,"target":null,"scoreFormula":"=IF(OR(COUNT(G19:H19)<2,H19=0),\\"\\",MIN(G19/H19,1)*100)"},{"recipient":"Бенефициар","name":"Возвращение участников в клубную активность","calculation":"Участники с действующим членством не менее 90 дней, у которых до первого посещения трека не было клубных активностей 90 дней, ÷ все уникальные посетители трека с членством не менее 90 дней за год. Один человек — один раз.","source":"Членство и история посещаемости","period":"Год","unit":"%","example":null,"target":null,"scoreFormula":"=IF(OR(COUNT(G20:H20)<2,H20=0),\\"\\",MIN(G20/H20,1)*100)"}],"economyTitle":"Экономика роли за год: затраты клуба и безвозмездный вклад","economyInputs":[{"name":"Подтверждённые прямые поступления","example":0,"unit":"руб./год","source":"Финансы; 0, если отдельных поступлений нет"},{"name":"Фактические выплаты лидеру трека","example":0,"unit":"руб./год","source":"Финансы; исходно 0 при бесплатном участии"},{"name":"Другие прямые расходы трека","example":null,"unit":"руб./год","source":"Финансы / акты по форматам"},{"name":"Часы сотрудников клуба за год","example":null,"unit":"час.","source":"Канбан / учёт времени"},{"name":"Полная стоимость часа сотрудников","example":null,"unit":"руб./час","source":"Финансы / кадровые данные"},{"name":"Безвозмездные часы лидера трека","example":null,"unit":"час.","source":"Длительность участия из календаря; подготовка — если подтверждена"},{"name":"Дополнительные расходы на систему","example":null,"unit":"руб./год","source":"Финансы / ИТ; 0, если не возникли"},{"name":"Утверждённый годовой бюджет роли","example":null,"unit":"руб./год","source":"Сопоставимый полный бюджет"},{"name":"Уникальные посетители форматов за год","example":null,"unit":"чел.","source":"Посещаемость; каждый человек один раз"}],"economyOutputs":[{"name":"Прямые поступления","formula":"=IF(COUNT(B24)<1,\\"\\",B24)","unit":"руб./год","explanation":"B24"},{"name":"Фактические прямые расходы","formula":"=IF(COUNT(B25:B26)<2,\\"\\",SUM(B25:B26))","unit":"руб./год","explanation":"B25 + B26"},{"name":"Стоимость времени сотрудников","formula":"=IF(COUNT(B27:B28)<2,\\"\\",B27*B28)","unit":"руб./год","explanation":"B27 × B28"},{"name":"Безвозмездный вклад носителя роли","formula":"=IF(COUNT(B29)<1,\\"\\",B29)","unit":"час.","explanation":"B29"},{"name":"Общие затраты клуба","formula":"=IF(COUNT(F25:F26,B30)<3,\\"\\",F25+F26+B30)","unit":"руб./год","explanation":"F25 + F26 + B30"},{"name":"Чистый финансовый результат","formula":"=IF(COUNT(F24,F28)<2,\\"\\",F24-F28)","unit":"руб./год","explanation":"F24 − F28"},{"name":"Затраты на одного посетителя","formula":"=IF(OR(COUNT(F28,B32)<2,B32=0),\\"\\",F28/B32)","unit":"руб./чел.","explanation":"F28 ÷ B32"},{"name":"Покрытие затрат поступлениями","formula":"=IF(OR(COUNT(F24,F28)<2,F28=0),\\"\\",F24/F28)","unit":"%","explanation":"F24 ÷ F28"},{"name":"Отклонение от годового бюджета","formula":"=IF(COUNT(B31,F28)<2,\\"\\",B31-F28)","unit":"руб./год","explanation":"B31 − F28"}],"requiredData":"Для эффектов: по ID лидера и трека связать встречи с уникальными посетителями; для возвращения — проверить членство и отсутствие других активностей 90 дней до первой встречи. Для экономики: реальные поступления, фактические выплаты (0 при бесплатном ведении), прямые расходы, часы сотрудников, бесплатные часы лидера, дополнительные расходы на систему, бюджет и уникальные посетители.","methodNote":"Безвозмездные часы носителя роли показаны отдельно и не увеличивают затраты клуба. Рыночный гонорар и продления членства не записываются как доход или экономия. Чистый результат = прямые поступления − затраты клуба; покрытие = поступления ÷ затраты. Недорасход бюджета при невыполненном плане не является экономией.","additionalRows":[]},{"name":"Лидер бизнес-экспедиции","description":"Лидер готовит и сопровождает экспедицию в согласованных полномочиях. В экономике считаем оплату мест и подтверждённые поступления, отдельно — специальные условия лидера и полные расходы поездки.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Выполненные участия лидера","calculation":"Экспедиции, в которых лидер фактически выполнил согласованное участие, ÷ экспедиции, в которых его участие было согласовано и срок наступил. Не требуем участия в каждой поездке.","source":"План участия и календарь экспедиций","period":"Год","unit":"%","example":"=IF(OR(COUNT(B63:C63)<2,C63=0,B63>C63,B63<0),\\"\\",B63/C63)","target":0.8,"scoreFormula":"=IF(OR(COUNT(H10:I10)<2,I10=0),\\"\\",MAX(0,MIN(H10/I10,1)*100))","weightedFormula":"=IF(COUNT(J10)<1,\\"\\",J10*B10)","action":"Сверить персональный план участия и причины пропусков."},{"name":"Актуальность","weight":0.15,"metric":"Экспедиции, где нужен лидер","calculation":"Утверждённые экспедиции с конкретной задачей для лидера ÷ все утверждённые экспедиции периода. Задача записывается до запуска; поездки без такой функции не включаются в числитель.","source":"Утверждённый план экспедиций","period":"Полугодие","unit":"%","example":"=IF(OR(COUNT(B64:C64)<2,C64=0,B64>C64,B64<0),\\"\\",B64/C64)","target":0.7,"scoreFormula":"=IF(OR(COUNT(H11:I11)<2,I11=0),\\"\\",MAX(0,MIN(H11/I11,1)*100))","weightedFormula":"=IF(COUNT(J11)<1,\\"\\",J11*B11)","action":"Проверить, для каких типов экспедиций нужна функция лидера."},{"name":"Управляемость","weight":0.2,"metric":"Выполненные условия управления","calculation":"0–5: лидер квалифицирован; мандат согласован; программа утверждена; условия участия оформлены; итоговый разбор назначен.","source":"Карточка экспедиции","period":"Экспедиция","unit":"Условий из 5","example":"=IF(OR(COUNT(B65)<1,B65>5,B65<0),\\"\\",B65)","target":5,"scoreFormula":"=IF(OR(COUNT(H12:I12)<2,I12=0),\\"\\",MAX(0,MIN(H12/I12,1)*100))","weightedFormula":"=IF(COUNT(J12)<1,\\"\\",J12*B12)","action":"Закрыть недостающие условия до поездки."},{"name":"Подтверждаемость","weight":0.15,"metric":"Полные карточки экспедиций","calculation":"Завершённые экспедиции с лидером, программой, списком участников, оплатами, фактом блоков и итогом ÷ все завершённые экспедиции.","source":"Карточка экспедиции","period":"Квартал","unit":"%","example":"=IF(OR(COUNT(B66:C66)<2,C66=0,B66>C66,B66<0),\\"\\",B66/C66)","target":0.95,"scoreFormula":"=IF(OR(COUNT(H13:I13)<2,I13=0),\\"\\",MAX(0,MIN(H13/I13,1)*100))","weightedFormula":"=IF(COUNT(J13)<1,\\"\\",J13*B13)","action":"Дополнить первичные документы."},{"name":"Результативность","weight":0.25,"metric":"Оценка выполнения роли сотрудником","calculation":"Раз в квартал сотрудник оценивает каждого задействованного лидера по четырём пунктам: выполнил согласованную задачу, был организован, был на связи, помог участникам в рамках задачи. Да = 100, частично = 50, нет = 0. Среднее по учтённым оценкам; без заданий — недостаточно данных.","source":"Карточка роли / оценка сотрудника","period":"Квартал","unit":"%","example":"=IF(OR(COUNT(B67:C67)<2,C67=0,B67>C67,B67<0),\\"\\",B67/C67)","target":0.75,"scoreFormula":"=IF(OR(COUNT(H14:I14)<2,I14=0),\\"\\",MAX(0,MIN(H14/I14,1)*100))","weightedFormula":"=IF(COUNT(J14)<1,\\"\\",J14*B14)","action":"Посмотреть конкретный пункт с низкой оценкой и согласовать действие с лидером."},{"name":"Операционная устойчивость","weight "Валовая выгода − общие затраты"}],"requiredData":"ID ведущего; ID события; дата; бриф; сценарий; оценка модерации; нарушения; повторное приглашение; стоимость внешнего аналога.","methodNote":"Пустой факт означает «Недостаточно данных». Проценты вводятся как 70%, а не 70. Жёлтые ячейки — ввод пользователя; остальные показатели и экономика пересчитываются автоматически.","additionalRows":[]},{"name":"Амбассадор CF","description":"Главный результат: амбассадоры поддерживают качество клубной среды, участвуют в адмиссии и согласованно представляют ClubFirst. Покупки членства учитываются отдельно и только при подтверждённой атрибуции.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Амбассадоры с подтверждённым вкладом","calculation":"Действующие амбассадоры хотя бы с одним подтверждённым действием за 12 месяцев ÷ все действующие амбассадоры. Действие: адмиссия, согласованное представительство, спикер, содержательная инициатива или рекомендация.","source":"Реестр ролей + события","period":"Год","unit":"%","example":"=IF(OR(COUNT(B63:C63)<2,C63=0),\\"\\",B63/C63)","target":0.7,"scoreFormula":"=IF(OR(COUNT(H10:I10)<2,I10=0),\\"\\",MAX(0,MIN(H10/I10,1)*100))","weightedFormula":"=IF(COUNT(J10)<1,\\"\\",J10*B10)","action":"Проверить, у кого нет согласованных возможностей проявить роль."},{"name":"Актуальность","weight":0.15,"metric":"Принятые запросы клуба","calculation":"Принятые амбассадорами запросы клуба ÷ адресованные им релевантные запросы за квартал. Если запросов не было, статус «Недостаточно данных», а не 0.","source":"Брифы / канбан","period":"Квартал","unit":"%","example":"=IF(OR(COUNT(B64:C64)<2,C64=0),\\"\\",B64/C64)","target":0.8,"scoreFormula":"=IF(OR(COUNT(H11:I11)<2,I11=0),\\"\\",MAX(0,MIN(H11/I11,1)*100))","weightedFormula":"=IF(COUNT(J11)<1,\\"\\",J11*B11)","action":"Уточнить с командой актуальные темы и доступность амбассадоров."},{"name":"Управляемость","weight":0.2,"metric":"Выполненные условия управления","calculation":"Введите 0–5: 1) ые действия.","source":"Интеграции / реестр","period":"Квартал","unit":"%","example":"=IF(OR(COUNT(B68:C68)<2,C68=0),\\"\\",B68/C68)","target":0.8,"scoreFormula":"=IF(OR(COUNT(H15:I15)<2,I15=0),\\"\\",MAX(0,MIN(H15/I15,1)*100))","weightedFormula":"=IF(COUNT(J15)<1,\\"\\",J15*B15)","action":"Подключить источник с наибольшей долей ручного ввода."}],"effects":[{"recipient":"Участник","name":"Доступ к преимуществам статуса","calculation":"Действующие амбассадоры, у которых есть бейдж и направлено предложение о размещении профиля на сайте, ÷ все действующие амбассадоры. Публикация профиля зависит от согласия участника.","source":"Реестр ролей / коммуникации","period":"Год","unit":"%","example":"=IF(OR(COUNT(B51:B52)<2,B52=0),\\"\\",B51/B52)","target":1,"scoreFormula":"=IF(OR(COUNT(G19:H19)<2,H19=0),\\"\\",MAX(0,MIN(G19/H19,1)*100))"},{"recipient":"Бенефициар","name":"Покупка членства после рекомендации","calculation":"Новые оплаченные членства с одним подтверждённым амбассадором-источником ÷ рекомендованные им кандидаты, прошедшие адмиссию. Покупки без атрибуции не включаем.","source":"CRM + адмиссия + платежи","period":"Год","unit":"%","example":"=IF(OR(COUNT(B24,B49)<2,B49=0),\\"\\",B24/B49)","target":0.4,"scoreFormula":"=IF(OR(COUNT(G20:H20)<2,H20=0),\\"\\",MAX(0,MIN(G20/H20,1)*100))"},{"recipient":"Бенефициар","name":"Качество официального представительства","calculation":"Согласованные представительства, где выполнена заранее записанная задача клуба и владелец не зафиксировал замечаний к мандату, ÷ все состоявшиеся согласованные представительства. Для каждого выхода ставится «да/нет».","source":"Канбан / реестр представительств","period":"Год","unit":"%","example":"=IF(OR(COUNT(B46:B47)<2,B46=0),\\"\\",B47/B46)","target":0.95,"scoreFormula":"=IF(OR(COUNT(G21:H21)<2,H21=0),\\"\\",MAX(0,MIN(G21/H21,1)*100))"}],"economyTitle":"Экономика амбассадорской роли за год","economyInputs":[{"name":"Оплаченные членства по подтверждённой рекомендации","example":null,"unit":"чел.","source":"CRM + платежи; один основной источник"},{"name":"Маржинальный доход одного нового членства","example":null,"unit":"руб./чел.","source":"Финансы; взнос минус переменные затраты обслуживания"},{"name":"Подтверждённая маржа отдельных партнёрств","example":null,"unit":"руб./год","source":"Договоры + финансы; только при прямой атрибуции"},{"name":"Закрытые мероприятия амбассадоров: прямые расходы","example":null,"unit":"руб./год","source":"Финансы; введите 0, если мероприятий не было"},{"name":"Представительство: поездки и организационные расходы","example":null,"unit":"руб./год","source":"Финансы; только оплаченные клубом затраты"},{"name":"Бейдж, профиль, коммуникации и признание","example":null,"unit":"руб./год","source":"Финансы; фактические расходы"},{"name":"Подтверждённые расходы на лояльность амбассадорам","example":null,"unit":"руб./год","source":"Финансы; 0, если таких условий нет"},{"name":"Часы команды на сопровождение роли за год","example":null,"unit":"час.","source":"Канбан / учёт времени"},{"name":"Полная стоимость часа команды","example":null,"unit":"руб./час","source":"Финансы / кадровые данные"},{"name":"Распределённая стоимость системы","example":null,"unit":"руб./год","source":"Финансы / ИТ; 0, если нет"}],"economyOutputs":[{"name":"Маржа новых членств","formula":"=IF(COUNT(B24:B25)<2,\\"\\",B24*B25)","unit":"руб./год","explanation":"Оплаченные членства × маржа на одно членство"},{"name":"Маржа партнёрств","formula":"=IF(COUNT(B26)<1,\\"\\",B26)","unit":"руб./год","explanation":"Только подтверждённая маржа, без пересечения с членствами"},{"name":"Совокупная маржа","formula":"=IF(COUNT(F24:F25)<2,\\"\\",SUM(F24:F25))","unit":"руб./год","explanation":"Маржа членств + отдельные партнёрства"},{"name":"Стоимость работы команды","formula":"=IF(COUNT(B31:B32)<2,\\"\\",B31*B32)","unit":"руб./год","explanation":"Часы × полная стоимость часа"},{"name":"Прямые расходы","formula":"=IF(COUNT(B27:B30)<4,\\"\\",SUM(B27:B30))","unit":"руб./год","explanation":"Мероприятия + представительство + профиль + лояльность"},{"name":"Доля системы","formula":"=IF(COUNT(B33)<1,\\"\\",B33)","unit":"руб./год","explanation":"Фактическая выделенная доля платформы"},{"name":"Все затраты","formula":"=IF(COUNT(F27:F29)<3,\\"\\",SUM(F27:F29))","unit":"руб./год","explanation":"Команда + прямые расходы + система"},{"name":"Расходы роли на одно оплаченное членство","formula":"=IF(OR(COUNT(F30,B24)<2,B24=0),\\"\\",F30/B24)","unit":"руб./чел.","explanation":"Все затраты ÷ оплаченные членства; не CAC"},{"name":"Чистый наблюдаемый результат","formula":"=IF(COUNT(F26,F30)<2,\\"\\",F26-F30)","unit":"руб./год","explanation":"Совокупная маржа − все затраты"},{"name":"Доходность затрат","formula":"=IF(OR(COUNT(F32,F30)<2,F30=0),\\"\\",F32/F30)","unit":"%","explanation":"Чистый результат ÷ все затраты"}],"requiredData":"Загрузить: реестр амбассадоров и решений, встречи адмиссии, задачи и согласования, рекомендации с ID кандидата, статус адмиссии и оплаты, маржу по новым членствам, партнёрства, затраты и труд команды. Действия хранить с источником и ID, без дублей.","methodNote":"Показатели и цели индекса — редактируемые настройки пилота. Пустой факт означает «Недостаточно данных», 0 вводится только при подтверждённом нуле. Балл каждого измерения ограничен 100; сумма взвешенных баллов даёт индекс здоровья.","additionalRows":[["Качественный вклад и контроль оснований роли",null,null,null,null,null,null,null],["Факт для фиксации","Ввод / расчёт","Источник","Как использовать",null,null,null,null],["Амбассадоры с 3+ адмиссионными встречами за год",null,"Адмиссия / реестр","Проверка одного из базовых критериев",null,null,null,null],["Амбассадоры с полным годом для проверки",null,"Реестр ролей","Знаменатель: без неполного года",null,null,null,null],["Доля, выполнившая критерий адмиссии","=IF(OR(COUNT(B42:B43)<2,B43=0),\\"\\",B42/B43)","Расчёт","B42 ÷ B43; не заменяет решение о статусе",null,null,null,null],["Приглашённые спикеры, которые фактически выступили",null,"Календарь / CRM","Содержательный вклад; не монетизируем без факта дохода",null,null,null,null],["Состоявшиеся согласованные представительства",null,"Канбан / согласования","Знаменатель качества представительства",null,null,null,null],["Из них с достигнутой задачей и без замечаний",null,"Проверка владельца","Числитель эффекта клуба: да/нет по каждому выходу",null,null,null,null],["Доля результативных представительств","=IF(OR(COUNT(B46:B47)<2,B46=0),\\"\\",B47/B46)","Расчёт","B47 ÷ B46",null,null,null,null],["Рекомендованные кандидаты, прошедшие адмиссию",null,"CRM / адмиссия","Знаменатель конверсии в покупку",null,null,null,null],["Оплаченные членства после рекомендации","=IF(COUNT(B24)<1,\\"\\",B24)","Платежи","Связано с B24; не вводить второй раз",null,null,null,null],["Амбассадоры с бейджем и предложением профиля",null,"Профиль / коммуникации","Числитель эффекта участника",null,null,null,null],["Действующие амбассадоры",null,"Реестр ролей","Знаменатель эффекта участника",null,null,null,null],["Правила учёта",null,null,null,null,null,null,null],["Основание статуса: 3 базовых критерия либо 2 базовых и 1 дополнительный; решение Комитета по Ценностям и руководства клуба обязательно. Стаж 5 лет / Хранитель 2+ или стаж 3 года / Хранитель 1+ с подтверждённой инициативной ролью — альтернативные ветви, не два независимых требования.",null,null,null,null,null,null,null],["Вклад в адмиссию, приглашение спикеров, формирование повестки и представительство фиксируем по ID действия, дате, связанному кандидату/событию, согласованию и результату. Привилегия участвовать в управлении не означает автоматического назначения.",null,null,null,null,null,null,null],["В экономику попадают только оплаченные членства с подтверждённой рекомендацией и единственным основным источником. Если тот же участник одновременно «Лидер мнений», покупку относим к одной роли при суммировании портфеля. Маржа = полученный взнос − переменные затраты обслуживания, не весь взнос.",null,null,null,null,null,null,null],["Партнёрства учитываем отдельно только при договоре, фактических поступлениях и подтверждённой роли амбассадора. Публичность, выступления и приглашённые спикеры не превращаются в рубли по условной цене PR. Экономия без утверждённого бюджета и фактического расхода не признаётся.",null,null,null,null,null,null,null],["Чистый результат — наблюдаемая маржа подтверждённых сделок минус все затраты роли, а не доказанный причинный ROI. Отсутствие покупок в периоде не означает отсутствие качественного эффекта. Пустое поле = нет данных; фактическое отсутствие расхода вводится как 0.",null,null,null,null,null,null,null],["Данные для автоматического расчёта индекса",null,null,null,null,null,null,null],["Измерение","Числитель / выполнено","Знаменатель","Какие записи брать",null,null,null,null],["Жизнеспособность",null,null,"Амбассадоры с подтверждённым действием ÷ Все действующие амбассадоры",null,null,null,null],["Актуальность",null,null,"Принятые релевантные запросы ÷ Все адресованные релевантные запросы",null,null,null,null],["Управляемость",null,5,"Выполненные условия из пяти ÷ Фиксированная цель: 5",null,null,null,null],["Подтверждаемость",null,null,"Действия с ID, датой, связью и подтверждением ÷ Все заявленные действия",null,null,null,null],["Результативность",null,null,"Выполненные и принятые в срок задачи ÷ Все принятые задачи со сроком в периоде",null,null,null,null],["Операционная устойчивость",null,null,"Действия без повторного ручного сбора ÷ Все подтверждённые действия",null,null,null,null]]},{"name":"Носитель ценностей","description":"Главный результат: Участник со второго года членства поддерживает культуру уважительного общения, доверие и содержательные связи в ClubFirst.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Переход участников на 2-й год","calculation":"Оплатившие 2-й год ÷ все участники, у которых завершился 1-й год. Статус присваивается автоматически и не входит в числитель.","source":"Членство и платежи","period":"Год","unit":"%","example":"=IF(E53=\\"\\",\\"\\",E53)","target":null,"scoreFormula":"=IF(OR(H10=\\"\\",I10=\\"\\",I10=0),\\"\\",MIN(H10/I10,1)*100)","weightedFormula":"=IF(J10=\\"\\",\\"\\",J10*B10)","action":"Проверить причины потери участников на переходе между годами."},{"name":"Актуальность","weight":0.15,"metric":"Востребованность носителей в задачах клуба","calculation":"Задачи квартального плана, где нужна роль, ÷ все утверждённые приоритетные задачи в её сфере. Участие во встречах не является обязательным условием.","source":"Квартальный план клуба","period":"Квартал","unit":"%","example":"=IF(E54=\\"\\",\\"\\",E54)","target":null,"scoreFormula":"=IF(OR(H11=\\"\\",I11=\\"\\",I11=0),\\"\\",MIN(H11/I11,1)*100)","weightedFormula":"=IF(J11=\\"\\",\\"\\",J11*B11)","action":"Проверить, в каких актуальных задачах роль действительно нужна клубу."},{"name":"Управляемость","weight":0.2,"metric":"5 условий управления статусом носителя","calculation":"Введите количество полностью выполненных условий: 0–5. Условия: 1) назначен владелец роли; 2) проверяется переход на второй год участия; 3) проверяются репутация и соблюдение Кодекса; 4) есть способ зафиксировать положительную обратную связь; 5) проводится периодический пересмотр статуса и преференции 6%. Балл = выполненные условия ÷ 5 × 100.","source":"Настройки роли и членство","period":"Год","unit":"Количество 0–5","example":"=IF(D62=\\"\\",\\"\\",D62)","target":5,"scoreFormula":"=IF(H12=\\"\\",\\"\\",MIN(H12/I12,1)*100)","weightedFormula":"=IF(J12=\\"\\",\\"\\",J12*B12)","action":"Создать задачу по каждому отсутствующему условию."},{"name":"Подтверждаемость","weight":0.15,"metric":"Подтверждённые основания присвоения","calculation":"Записи роли с датой вступления, подтверждённым вторым годом, проверкой Кодекса и решением о присвоении ÷ все действующие носители роли.","source":"Карточка статуса","period":"Квартал","unit":"%","example":"=IF(E63=\\"\\",\\"\\",E63)","target":0.95,"scoreFormula":"=IF(H13=\\"\\",\\"\\",MIN(H13/I13,1)*100)","weightedFormula":"=IF(J13=\\"\\",\\"\\",J13*B13)","action":"Дозаполнить карточки статуса и источник каждого основания."},{"name":"Результативность","weight":0.25,"metric":"Носители с подтверждённым полезным вкладом","calculation":"Действующие носители с хотя бы одним полезным вкладом, подтверждённым получателем или командой за 12 месяцев ÷ все действующие носители.","source":"Реестр вкладов и ролей","period":"12 месяцев","unit":"%","example":"=IF(E55=\\"\\",\\"\\",E55)","target":0.7,"scoreFormula":"=IF(H14=\\"\\",\\"\\",MIN(H14/I14,1)*100)","weightedFormula":"=IF(J14=\\"\\",\\"\\",J14*B14)","action":"Проверить подтверждения результатов и предложить возможности для вклада."},{"name":"Операционная устойчивость","weight":0.1,"metric":"Автоматическое обновление статуса и скидки","calculation":"Записи, где год членства, статус и право на скидку 6% обновлены из системы членства без ручного переноса, ÷ все обновлённые записи роли.","source":"Система членства и профиль","period":"Квартал","unit":"%","example":"=IF(E64=\\"\\",\\"\\",E64)","target":0.9,"scoreFormula":"=IF(H15=\\"\\",\\"\\",MIN(H15/I15,1)*100)","weightedFormula":"=IF(J15=\\"\\",\\"\\",J15*B15)","action":"Связать членство, статус и финансовую преференцию по ID участника."}],"effects":[{"recipient":"Участник","name":"Фактически полученная преференция","calculation":"Факт = сумма скидок, реально применённых при оплаченных продлениях, ÷ положенная сумма по соответствующей ставке. Сумму в рублях показываем в экономике. Если оплаченных продлений не было, эффекта за период не оцениваем.","source":"Система членства / платежи по ID участника","period":"Год","unit":"%","example":"=IF(E56=\\"\\",\\"\\",E56)","target":1,"scoreFormula":"=IF(OR(COUNT(G19:H19)<2,H19=0),\\"\\",MIN(G19/H19,1)*100)"},{"recipient":"Бенефициар","name":"Активное участие после продления","calculation":"Носители роли, посетившие хотя бы одну клубную активность в течение 90 дней после продления, ÷ все продлившие носители роли, для которых эти 90 дней истекли. Считаем участие, а не приписываем роли причину продления.","source":"Членство и посещаемость по ID участника","period":"Год","unit":"%","example":"=IF(E57=\\"\\",\\"\\",E57)","target":null,"scoreFormula":"=IF(OR(COUNT(G20:H20)<2,H20=0),\\"\\",MIN(G20/H20,1)*100)"}],"economyTitle":"Экономика специального предложения за год","economyInputs":[{"name":"Сумма взносов до скидки по оплаченным продлениям","example":null,"unit":"руб./год","source":"Платежи; только продления со 2-го года"},{"name":"Фактическая сумма скидок 6%","example":null,"unit":"руб./год","source":"Платежи; сумма применённой скидки"},{"name":"Часы сотрудников на роль за год","example":null,"unit":"час.","source":"Канбан / учёт времени"},{"name":"Полная стоимость часа сотрудников","example":null,"unit":"руб./час","source":"Финансы / кадровые данные"},{"name":"Прямые расходы на признание и коммуникации","example":null,"unit":"руб./год","source":"Финансы; 0, если нет"},{"name":"Дополнительные расходы на систему","example":null,"unit":"руб./год","source":"Финансы / ИТ; 0, если нет"},{"name":"Годовой бюджет предложения и сопровождения","example":null,"unit":"руб./год","source":"Утверждённый бюджет"},{"name":"Оплаченные продления со скидкой","example":null,"unit":"чел.","source":"Членство / платежи"},{"name":"Действующие носители роли","example":null,"unit":"чел.","source":"Реестр ролей на конец периода"}],"economyOutputs":[{"name":"Положенная скидка","formula":"=IF(COUNT(B24)<1,\\"\\",B24*$C$42)","unit":"руб./год","explanation":"По ставке специального предложения"},{"name":"Фактически применённая скидка","formula":"=IF(COUNT(B25)<1,\\"\\",B25)","unit":"руб./год","explanation":"Из проведённых продлений"},{"name":"Взносы после этой скидки","formula":"=IF(COUNT(B24:B25)<2,\\"\\",B24-B25)","unit":"руб./год","explanation":"База взносов − скидка"},{"name":"Стоимость работы сотрудников","formula":"=IF(COUNT(B26:B27)<2,\\"\\",B26*B27)","unit":"руб./год","explanation":"Часы × стоимость часа"},{"name":"Прямые и системные расходы","formula":"=IF(COUNT(B28:B29)<2,\\"\\",SUM(B28:B29))","unit":"руб./год","explanation":"Фактические расходы"},{"name":"Полная стоимость программы","formula":"=IF(COUNT(F25,F27:F28)<3,\\"\\",F25+F27+F28)","unit":"руб./год","explanation":"Скидка + работа + расходы"},{"name":"Скидка на одно продление","formula":"=IF(OR(COUNT(F25,B31)<2,B31=0),\\"\\",F25/B31)","unit":"руб./чел.","explanation":"Фактическая скидка ÷ продления"},{"name":"Стоимость на носителя роли","formula":"=IF(OR(COUNT(F29,B32)<2,B32=0),\\"\\",F29/B32)","unit":"руб./чел.","explanation":"Стоимость программы ÷ носители"},{"name":"Финансовый результат программы","formula":"=IF(COUNT(F29)<1,\\"\\",-F29)","unit":"руб./год","explanation":"− стоимость программы"},{"name":"Отклонение от бюджета","formula":"=IF(COUNT(B30,F29)<2,\\"\\",B30-F29)","unit":"руб./год","explanation":"Бюджет − стоимость программы"}],"requiredData":"Загрузить по ID носителя: дату начала и непрерывность членства, оплаченные продления со 2-го года, базовый взнос до предложения и фактическую скидку 6%. Для эффекта клуба связать продление с посещаемостью последующих 90 дней. Также внести часы сотрудников, прямые расходы, дополнительные расходы на систему, бюджет и число действующих носителей.","methodNote":"Финансовый результат роли = − полная стоимость программы (скидка + сопровождение + дополнительные расходы). Взносы после скидки показаны справочно и не приписаны роли как новая выручка. Скидка — выпадающий доход, не второй раз оплаченный расход. Нулевой бюджет или расход вводите как 0; отсутствие данных оставляйте пустым.","additionalRows":[["Условия специального предложения",null,null,null,null,null,null,null],["Роль","Когда действует","Ставка","Правило расчёта",null,null,null,null],["Носитель ценностей","Со 2-го года членства",0.06,"6% от взноса при оплаченном продлении",null,null,null,null],["Для расчёта B24 и B25 берите за один год и одну группу оплаченных продлений. Разница между положенной (F24) и фактической (F25) скидкой требует проверки. Преференция хранителя не должна одновременно учитываться здесь без подтверждённого правила совмещения.",null,null,null,null,null,null,null],["Основания расчёта и проверка данных",null,null,null,null,null,null,null],["Жёлтые поля — ввод из выгрузки. Пусто = данных нет; 0 = подтверждённый ноль. Цели в I10–I11 установите после базового периода.",null,null,null,null,null,null,null],["Блок","Показатель","Всего / база","Из них / факт","Доля или разница","Как берём данные","Период","ID выгрузки / ссылка"],["Индекс","Переход на 2-й год",null,null,"=IF(OR(COUNT(C53:D53)<2,C53=0,D53<0,D53>C53),\\"\\",D53/C53)","C: Завершили 1-й год; D: Оплатили 2-й год. Членство и платежи; паузы исключить.","Год",null],["Индекс","Актуальность носителей",null,null,"=IF(OR(COUNT(C54:D54)<2,C54=0,D54<0,D54>C54),\\"\\",D54/C54)","C: Приоритеты по культуре; D: Роль нужна. Утверждённый квартальный план.","Квартал",null],["Индекс","Подтверждённый вклад","=IF(COUNT(B32)<1,\\"\\",B32)",null,"=IF(OR(COUNT(C55:D55)<2,C55=0,D55<0,D55>C55),\\"\\",D55/C55)","C: Активные носители; D: С подтверждённым вкладом. Реестр вкладов, отметка команды.","12 месяцев",null],["Участник","Фактически полученная скидка","=IF(COUNT(F24)<1,\\"\\",F24)","=IF(COUNT(F25)<1,\\"\\",F25)","=IF(OR(COUNT(C56:D56)<2,C56=0,D56<0,D56>C56),\\"\\",D56/C56)","C: Положенная скидка, ₽; D: Применённая скидка, ₽. Оплаченные продления со 2-го года.","Год",null],["Клуб","Участие после продления",null,null,"=IF(OR(COUNT(C57:D57)<2,C57=0,D57<0,D57>C57),\\"\\",D57/C57)","C: Продлили, прошло 90 дней; D: Посетили за 90 дней. Членство и посещаемость по ID.","Год",null],["Экономика","Сверка полной стоимости","=IF(COUNT(F29)<1,\\"\\",F29)",null,"=IF(COUNT(C58:D58)<2,\\"\\",C58-D58)","C: стоимость программы; D: контрольная сумма финансов за тот же год.","Год",null],["Проверка остальных измерений индекса",null,null,null,null,null,null,null],["Блок","Показатель","Всего / база","Из них / факт","Доля или разница","Как берём данные","Период","ID выгрузки / ссылка"],["Управляемость","Выполненные условия управления",5,null,"=IF(OR(COUNT(C62:D62)<2,C62=0,D62<0,D62>C62),\\"\\",D62/C62)","C: 5 условий; D: сколько выполнено. Настройки роли.","Год",null],["Подтверждаемость","Подтверждённые записи роли",null,null,"=IF(OR(COUNT(C63:D63)<2,C63=0,D63<0,D63>C63),\\"\\",D63/C63)","C: все активные записи; D: записи с полным основанием. Реестр.","Квартал",null],["Операционная устойчивость","Автоматические обновления",null,null,"=IF(OR(COUNT(C64:D64)<2,C64=0,D64<0,D64>C64),\\"\\",D64/C64)","C: все обновления; D: без ручного переноса. Журнал системы.","Квартал",null],["Для каждой строки укажите ID выгрузки или ссылку на реестр. Проверка данных не входит в балл индекса и не скрывает пропуски.",null,null,null,null,null,null,null]]},{"name":"Хранитель ценностей","description":"Главный результат: Долгосрочные участники поддерживают клубную память, преемственность и норму поведения.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Переход участников на 3-й год","calculation":"Оплатившие 3-й год ÷ все участники, у которых завершился 2-й год. Статус присваивается автоматически и не входит в числитель.","source":"Членство и платежи","period":"Год","unit":"%","example":"=IF(E53=\\"\\",\\"\\",E53)","target":null,"scoreFormula":"=IF(OR(H10=\\"\\",I10=\\"\\",I10=0),\\"\\",MIN(H10/I10,1)*100)","weightedFormula":"=IF(J10=\\"\\",\\"\\",J10*B10)","action":"Проверить причины потери участников на переходе между годами."},{"name":"Актуальность","weight":0.15,"metric":"Востребованность хранителей в задачах клуба","calculation":"Задачи квартального плана, где нужна роль, ÷ все утверждённые приоритетные задачи в её сфере. Участие во встречах не является обязательным условием.","source":"Квартальный план клуба","period":"Квартал","unit":"%","example":"=IF(E54=\\"\\",\\"\\",E54)","target":null,"scoreFormula":"=IF(OR(H11=\\"\\",I11=\\"\\",I11=0),\\"\\",MIN(H11/I11,1)*100)","weightedFormula":"=IF(J11=\\"\\",\\"\\",J11*B11)","action":"Проверить, в каких актуальных задачах роль действительно нужна клубу."},{"name":"Управляемость","weight":0.2,"metric":"5 условий управления хранителями","calculation":"Введите количество полностью выполненных условий: 0–5. Условия: 1) утверждены пороги стажа; 2) проверяется отсутствие нарушений; 3) назначен владелец; 4) есть форматы вклада; 5) проводится ежегодный пересмотр. Балл = выполненные условия ÷ 5 × 100.","source":"Настройки роли","period":"Год","unit":"Количество 0–5","example":"=IF(D63=\\"\\",\\"\\",D63)","target":5,"scoreFormula":"=IF(H12=\\"\\",\\"\\",MIN(H12/I12,1)*100)","weightedFormula":"=IF(J12=\\"\\",\\"\\",J12*B12)","action":"Утвердить отсутствующие правила до присвоения уровня."},{"name":"Подтверждаемость","weight":0.15,"metric":"Подтверждённые уровни хранителя","calculation":"Носители с подтверждёнными оплатами, стажем, уровнем и проверкой Кодекса ÷ все носители роли.","source":"Членство / профиль","period":"Год","unit":"%","example":"=IF(E64=\\"\\",\\"\\",E64)","target":0.95,"scoreFormula":"=IF(H13=\\"\\",\\"\\",MIN(H13/I13,1)*100)","weightedFormula":"=IF(J13=\\"\\",\\"\\",J13*B13)","action":"Сверить оплаты, полные годы и статус Кодекса."},{"name":"Результативность","weight":0.25,"metric":"Хранители с подтверждённым культурным вкладом","calculation":"Действующие хранители с хотя бы одним завершённым и принятым клубом культурным вкладом за 12 месяцев ÷ все действующие хранители.","source":"Реестр вкладов и ролей","period":"12 месяцев","unit":"%","example":"=IF(E55=\\"\\",\\"\\",E55)","target":0.7,"scoreFormula":"=IF(H14=\\"\\",\\"\\",MIN(H14/I14,1)*100)","weightedFormula":"=IF(J14=\\"\\",\\"\\",J14*B14)","action":"Проверить подтверждения результатов и предложить возможности для вклада."},{"name":"Операционная устойчивость","weight":0.1,"metric":"Автоматический расчёт уровня","calculation":"Носители, чей уровень рассчитан автоматически по оплатам и проверкам ÷ все носители роли.","source":"Интеграции","period":"Месяц","unit":"%","example":"=IF(E65=\\"\\",\\"\\",E65)","target":0.95,"scoreFormula":"=IF(H15=\\"\\",\\"\\",MIN(H15/I15,1)*100)","weightedFormula":"=IF(J15=\\"\\",\\"\\",J15*B15)","action":"Связать платежи, стаж и уровни роли."}],"effects":[{"recipient":"Участник","name":"Фактически полученная преференция","calculation":"Факт = сумма скидок, реально применённых при оплаченных продлениях, ÷ положенная сумма по соответствующей ставке. Сумму в рублях показываем в экономике. Если оплаченных продлений не было, эффекта за период не оцениваем.","source":"Система членства / платежи по ID участника","period":"Год","unit":"%","example":"=IF(E56=\\"\\",\\"\\",E56)","target":1,"scoreFormula":"=IF(OR(COUNT(G19:H19)<2,H19=0),\\"\\",MIN(G19/H19,1)*100)"},{"recipient":"Бенефициар","name":"Активное участие после продления","calculation":"Носители роли, посетившие хотя бы одну клубную активность в течение 90 дней после продления, ÷ все продлившие носители роли, для которых эти 90 дней истекли. Считаем участие, а не приписываем роли причину продления.","source":"Членство и посещаемость по ID участника","period":"Год","unit":"%","example":"=IF(E57=\\"\\",\\"\\",E57)","target":null,"scoreFormula":"=IF(OR(COUNT(G20:H20)<2,H20=0),\\"\\",MIN(G20/H20,1)*100)"},{"recipient":"Участник","name":"Доступ к специальным мероприятиям","calculation":"Хранители второго уровня и выше, приглашённые хотя бы на одно специальное мероприятие за год, ÷ все действующие хранители второго уровня и выше. Если мероприятий не было, эффект не оценивается.","source":"Реестр уровней / приглашения","period":"Год","unit":"%","example":"=IF(E58=\\"\\",\\"\\",E58)","target":1,"scoreFormula":"=IF(OR(COUNT(G21:H21)<2,H21=0),\\"\\",MIN(G21/H21,1)*100)"}],"economyTitle":"Экономика специального предложения за год","economyInputs":[{"name":"Прямые расходы специальных мероприятий для уровня 2+","example":null,"unit":"руб./год","source":"Финансы / акты; 0, если не проводились"},{"name":"Часы сотрудников на роль за год","example":null,"unit":"час.","source":"Канбан / учёт времени"},{"name":"Полная стоимость часа сотрудников","example":null,"unit":"руб./час","source":"Финансы / кадровые данные"},{"name":"Дополнительные расходы на систему","example":null,"unit":"руб./год","source":"Финансы / ИТ; 0, если нет"},{"name":"Прямые расходы на признание и коммуникации","example":null,"unit":"руб./год","source":"Финансы; 0, если нет"},{"name":"Годовой бюджет предложения и сопровождения","example":null,"unit":"руб./год","source":"Утверждённый бюджет"},{"name":"Действующие хранители всех уровней","example":null,"unit":"чел.","source":"Реестр ролей на конец периода"},{"name":"Хранители уровня 2+ с правом на мероприятия","example":null,"unit":"чел.","source":"Реестр уровней"},{"name":"Приглашённые хранители уровня 2+","example":null,"unit":"чел.","source":"Модуль приглашений"}],"economyOutputs":[{"name":"Положенная скидка","formula":"=IF(COUNT(E42:E45)<4,\\"\\",SUM(F42:F45))","unit":"руб./год","explanation":"По ставке специального предложения"},{"name":"Фактически применённая скидка","formula":"=IF(COUNT(G42:G45)<4,\\"\\",SUM(G42:G45))","unit":"руб./год","explanation":"Из проведённых продлений"},{"name":"Взносы после этой скидки","formula":"=IF(COUNT(E42:E45,G42:G45)<8,\\"\\",SUM(H42:H45))","unit":"руб./год","explanation":"База взносов − скидка"},{"name":"Стоимость работы сотрудников","formula":"=IF(COUNT(B25:B26)<2,\\"\\",B25*B26)","unit":"руб./год","explanation":"Часы × стоимость часа"},{"name":"Прямые и системные расходы","formula":"=IF(COUNT(B24,B27:B28)<3,\\"\\",B24+B27+B28)","unit":"руб./год","explanation":"Фактические расходы"},{"name":"Полная стоимость программы","formula":"=IF(COUNT(F25,F27:F28)<3,\\"\\",F25+F27+F28)","unit":"руб./год","explanation":"Скидка + работа + расходы"},{"name":"Скидка на одно продление","formula":"=IF(OR(COUNT(F25,D46)<2,D46=0),\\"\\",F25/D46)","unit":"руб./чел.","explanation":"Фактическая скидка ÷ продления"},{"name":"Стоимость на носителя роли","formula":"=IF(OR(COUNT(F29,B30)<2,B30=0),\\"\\",F29/B30)","unit":"руб./чел.","explanation":"Стоимость программы ÷ носители"},{"name":"Финансовый результат программы","formula":"=IF(COUNT(F29)<1,\\"\\",-F29)","unit":"руб./год","explanation":"− стоимость программы"},{"name":"Отклонение от бюджета","formula":"=IF(COUNT(B29,F29)<2,\\"\\",B29-F29)","unit":"руб./год","explanation":"Бюджет − стоимость программы"}],"requiredData":"По каждому уровню хранителя загрузить число оплаченных продлений, сумму взносов до скидки и фактически применённую скидку; эти данные заполняют D, E и G строк 42–45. Отдельно загрузить расходы специальных мероприятий для уровня 2+, часы сотрудников, расходы признания и системы, бюджет и численность хранителей. Эффект клуба берётся из членства и посещаемости после продления.","methodNote":"Стоимость программы = фактические скидки по четырём уровням + работа сотрудников + расходы мероприятий, признания и системы. Чистый финансовый результат роли показан как − стоимость программы; взносы после скидки справочные, без приписывания продлений роли. Разница положенной и фактической скидки требует проверки.","additionalRows":[["Специальные предложения по уровням хранителя",null,null,null,null,null,null,null],["Уровень","Стаж","Ставка","Продления","База до скидки","Положенная скидка","Фактическая скидка","Взнос после скидки"],["Первый","3–4 года",0.09,null,null,"=IF(COUNT(E42)<1,\\"\\",E42*C42)",null,"=IF(COUNT(E42,G42)<2,\\"\\",E42-G42)"],["Второй","5–6 лет",0.11,null,null,"=IF(COUNT(E43)<1,\\"\\",E43*C43)",null,"=IF(COUNT(E43,G43)<2,\\"\\",E43-G43)"],["Третий","7–8 лет",0.13,null,null,"=IF(COUNT(E44)<1,\\"\\",E44*C44)",null,"=IF(COUNT(E44,G44)<2,\\"\\",E44-G44)"],["Четвёртый","9–10 лет",0.15,null,null,"=IF(COUNT(E45)<1,\\"\\",E45*C45)",null,"=IF(COUNT(E45,G45)<2,\\"\\",E45-G45)"],["Итого",null,null,"=IF(COUNT(D42:D45)<4,\\"\\",SUM(D42:D45))","=IF(COUNT(E42:E45)<4,\\"\\",SUM(E42:E45))","=IF(COUNT(F42:F45)<4,\\"\\",SUM(F42:F45))","=IF(COUNT(G42:G45)<4,\\"\\",SUM(G42:G45))","=I COUNT(F28,F30)<2,\\"\\",F28-F30)","unit":"руб./год","explanation":null},{"name":"Затраты на сопровождаемого","formula":"=IF(OR(COUNT(F30,B33)<2,B33=0),\\"\\",F30/B33)","unit":"руб./чел.","explanation":null},{"name":"Сценарная доходность затрат","formula":"=IF(OR(COUNT(F31,F30)<2,F30=0),\\"\\",F31/F30)","unit":"%","explanation":null}],"requiredData":"Для оценки нужны подтверждённые пары, даты начала и 90-го дня, итоговый статус каждой пары, один ответ новичка о помощи Проводника. Для сценария экономики отдельно нужны продления сопоставимых когорт и фактические затраты. Посещения мероприятий не требуются.","methodNote":"Сравнение продлений допустимо только при одинаковом окне первого продления и сопоставимых когортах. Положительную разницу умножаем на численность группы с проводником; отрицательную не превращаем в «отрицательные продления». Сценарий не доказывает причинный эффект. Расходы считаем независимо даже при отсутствии данных для сценария. Пустой ввод — нет данных; подтверждённое отсутствие расхода — 0. Цели индекса и эффектов можно скорректировать после пилота.","additionalRows":[["Факты для оценки эффектов",null,null,null,null,null,null,null],["Факт","Ввод / расчёт","Источник","Использование",null,null,null,null],["Ответы новичков «Да»",null,"Один вопрос о помощи Проводника","Число ответов с весом 100",null,null,null,null],["Ответы новичков «Частично»",null,"Один вопрос о помощи Проводника","Число ответов с весом 50",null,null,null,null],["Ответы новичков «Нет»",null,"Один вопрос о помощи Проводника","Число ответов с весом 0",null,null,null,null],["Завершённые пары — из индекса","=IF(COUNT(B67)<1,\\"\\",B67)","Связь со строкой 67","Автоматически, повторный ввод не нужен",null,null,null,null],["Пары с наступившим 90-м днём — из индекса","=IF(COUNT(C67)<1,\\"\\",C67)","Связь со строкой 67","Автоматически, повторный ввод не нужен",null,null,null,null],["Данные для автоматического расчёта индекса",null,null,null,null,null,null,null],["Измерение","Числитель / выполнено","Знаменатель","Какие записи брать","Проверка",null,null,null],["Активные проводники",null,null,"Проводники с закреплением за год ÷ Все действующие проводники","=IF(COUNT(B63:C63)<2,\\"\\",IF(B63>C63,\\"Проверьте: числитель больше базы\\",\\"\\"))",null,null,null],["Своевременные назначения",null,null,"Новички с проводником в срок ÷ Все согласившиеся новички со сроком","=IF(COUNT(B64:C64)<2,\\"\\",IF(B64>C64,\\"Проверьте: числитель больше базы\\",\\"\\"))",null,null,null],["Выполненные условия управления",null,5,"Выполненные условия ÷ 5 условий","=IF(COUNT(B65:C65)<2,\\"\\",IF(B65>C65,\\"Проверьте: числитель больше базы\\",\\"\\"))",null,null,null],["Карточки с итоговым статусом",null,null,"Полные карточки пары ÷ все пары, у которых наступил 90-й день. Прекращённая пара с зафиксированным итогом тоже имеет полную карточку.","=IF(COUNT(B66:C66)<2,\\"\\",IF(B66>C66,\\"Проверьте: числитель больше базы\\",\\"\\"))",null,null,null],["Завершённое сопровождение",null,null,"B: пары со статусом «завершено» на 90-й день; C: все подтверждённые пары, у которых в периоде наступил 90-й день. Досрочно прекращённые и пары без итога остаются в C.","=IF(COUNT(B67:C67)<2,\\"\\",IF(B67>C67,\\"Проверьте: числитель больше базы\\",\\"\\"))",null,null,null],["Пары без перегрузки",null,null,"Пары без перегрузки и с контактом ÷ Все активные пары","=IF(COUNT(B68:C68)<2,\\"\\",IF(B68>C68,\\"Проверьте: числитель больше базы\\",\\"\\"))",null,null,null]]},{"name":"Основатель отраслевого клуба","description":"Главный результат: согласованный с ClubFirst отраслевого клуб проходит пилот и передаётся в регулярную работу. Статус основателя сохраняется при смене действующего лидера.","dimensions":[{"name":"Жизнеспособность","weight":0.15,"metric":"Основанные отраслевые клубы с регулярной работой","calculation":"Основанные отраслевые клубы, где после пилота есть действующий лидер и календарь встреч, ÷ все клубы этого типа с активным статусом. Передача лидерства не отменяет статус основателя.","source":"Реестр клубов и календарь","period":"Полугодие","unit":"%","example":null,"target":0.85,"scoreFormula":"=IF(H10=\\"\\",\\"\\",MIN(H10/I10,1)*100)","weightedFormula":"=IF(J10=\\"\\",\\"\\",J10*B10)","action":"Назначить текущего лидера и согласовать календарь; не пересматривать статус основателя только из-за передачи лидерства."},{"name":"Актуальность","weight":0.15,"metric":"Покрытие приоритетных отраслей","calculation":"Приоритетные отрасли с действующим отраслевым клубом или согласованным пилотом ÷ все отрасли в заранее утверждённом списке с наибольшим числом действующих участников ClubFirst. Список составляется по основной отрасли компании в профиле на начало полугодия. Каждую отрасль учитываем один раз.","source":"Профиль участников / ПСВ + реестр отраслевых клубов","period":"Полугодие","unit":"%","example":"=IF(COUNT(B44)<1,\\"\\",B44)","target":1,"scoreFormula":"=IF(OR(COUNT(H11:I11)<2,I11=0),\\"\\",MIN(H11/I11,1)*100)","weightedFormula":"=IF(COUNT(J11)<1,\\"\\",J11*B11)","action":"Сначала проработать отрасли с наибольшим числом участников, где ещё нет клуба или пилота."},{"name":"Управляемость","weight":0.2,"metric":"5 условий основания отраслевого клуба","calculation":"Введите 0–5 полностью выполненных условий: 1) назначен владелец процесса; 2) команда согласовала отраслевой профиль и формат встреч в рамках членства; 3) подтверждены не менее 4 встреч, 15 релевантных участников и ядро из 5; 4) раздельно зафиксированы основатель и действующий лидер; 5) пройдена проверка Кодекса, жалоб и конфликта интересов. Балл = выполнено ÷ 5 × 100.","source":"Карточка основания клуба","period":"При присвоении","unit":"Количество 0–5","example":null,"target":5,"scoreFormula":"=IF(H12=\\"\\",\\"\\",MIN(H12/I12,1)*100)","weightedFormula":"=IF(J12=\\"\\",\\"\\",J12*B12)","action":"Закрыть недостающие условия до признания статуса."},{"name":"Подтверждаемость","weight":0.15,"metric":"Полные досье отраслевого клуба","calculation":"Досье с ID клуба и основателя, решением команды, датами 4 встреч, 15 уникальными релевантными участниками, ядром из 5 и решением о статусе ÷ все присвоенные статусы основателя отраслевого клуба.","source":"Карточка клуба и события","period":"Квартал","unit":"%","example":null,"target":0.95,"scoreFormula":"=IF(H13=\\"\\",\\"\\",MIN(H13/I13,1)*100)","weightedFormula":"=IF(J13=\\"\\",\\"\\",J13*B13)","action":"Связать доказательства запуска с карточкой основателя."},{"name":"Результативность","weight":0.25,"metric":"Устойчивый запуск отраслевого клуба","calculation":"Клубы с регулярными встречами и активным ядром не менее 5 человек через 6 месяцев после присвоения статуса ÷ клубы этого типа, для которых прошло 6 месяцев. Это оценка запуска, а не условие сохранения статуса основателя.","source":"Календарь и реестр участников","period":"Полугодие","unit":"%","example":null,"target":0.75,"scoreFormula":"=IF(H14=\\"\\",\\"\\",MIN(H14/I14,1)*100)","weightedFormula":"=IF(J14=\\"\\",\\"\\",J14*B14)","action":"Разобрать причины снижения активности и поддержать действующего лидера."},{"name":"Операционная устойчивость","weight":0.1,"metric":"Передача клуба в регулярное управление","calculation":"Основанные отраслевые клубы с назначенным действующим лидером, календарём и владельцем операционных задач ÷ все клубы этого типа, завершившие пилот.","source":"Карточка клуба и канбан","period":"Полугодие","unit":"%","example":null,"target":0.9,"scoreFormula":"=IF(H15=\\"\\",\\"\\",MIN(H15/I15,1)*100)","weightedFormula":"=IF(J15=\\"\\",\\"\\",J15*B15)","action":"Закрыть передачу задач и обновить распределение полномочий."}],"effects":[{"recipient":"Участник","name":"Публичная видимость основателя","calculation":"Отметьте 1, если имя основателя отраслевого клуба указано в анонсе запуска, на странице клуба и в профиле; иначе 0. Факт = сумма трёх отметок ÷ 3. Проверка по опубликованным материалам за первый год.","source":"Анонс запуска, страница клуба, профиль участника","period":"Первый год","unit":"Три отметки 0/1","example":"=IF(
